name: Verify Resonance Studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - name: Start API for frontend integration tests
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/resonance-api.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/api/health
      - run: npm test
        env:
          TEST_API_BASE_URL: http://127.0.0.1:8000
      - run: npm run build
      - name: Show API diagnostics on failure
        if: failure()
        run: cat /tmp/resonance-api.log || true
